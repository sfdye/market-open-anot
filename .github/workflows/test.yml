name: Test

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on a branch are pointless once a newer commit exists.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Two programs: the app against React Native's globals, lib/core against Node's.
      - run: npm run typecheck
      - run: npm test
