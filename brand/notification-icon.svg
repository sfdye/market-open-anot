<?xml version="1.0" encoding="UTF-8"?>
<!-- Open Anot? status-bar glyph: the awning alone, no bulb. Why, and why solid rather
     than the app icon's line art, is in brand/README.md. -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <g fill="#ffffff">
    <!-- canopy: narrow top bar flaring out to the full width -->
    <path d="M20 16 H76 L92 42 H4 Z"/>
    <!-- scallop fringe: five lobes, deep enough to survive a 4x downscale -->
    <circle cx="12" cy="42" r="9"/>
    <circle cx="30" cy="42" r="9"/>
    <circle cx="48" cy="42" r="9"/>
    <circle cx="66" cy="42" r="9"/>
    <circle cx="84" cy="42" r="9"/>
    <!-- legs -->
    <rect x="9" y="46" width="8" height="34" rx="3.5"/>
    <rect x="79" y="46" width="8" height="34" rx="3.5"/>
  </g>
</svg>
