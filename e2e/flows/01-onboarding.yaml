appId: ${APP_ID}
tags: [smoke]
---
# Onboarding: fresh launch → go to Today → auto-push to /add → search → pick market → back to Today.
- runFlow: ../utils/launch.yaml
# Ensure we're on the Today tab (app sometimes starts on Map).
- tapOn:
    id: tab-today
# Wait for the app to hydrate and the auto-push to /add to fire.
- extendedWaitUntil:
    visible:
      id: done-button
    timeout: 20000
# Search for a well-known market.
- tapOn: "Search.*"
- inputText: Tiong Bahru
# Tap the matching picker row.
- tapOn: "Tiong Bahru Market"
# Dismiss the keyboard by tapping the search bar's Close button.
- tapOn: "close"
- waitForAnimationToEnd
# Dismiss the add modal via the Done button (now visible after keyboard dismissal).
- tapOn:
    id: done-button
- waitForAnimationToEnd
# Back on Today — the market row should be visible.
- assertVisible:
    id: market-row
    index: 0
