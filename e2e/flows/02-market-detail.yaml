appId: ${APP_ID}
tags: [smoke]
---
# Market detail: tap a row → detail shows status, address → favorite toggle → back.
# Precondition: at least one favourite exists.
- runFlow: ../utils/launch.yaml
- tapOn:
    id: tab-today
- waitForAnimationToEnd
# If the add modal auto-opened (no favourites), add one first.
- runFlow:
    when:
      visible: { id: done-button }
    commands:
      - tapOn: "Search.*"
      - inputText: Tiong Bahru
      - tapOn: "Tiong Bahru Market"
      - tapOn: "close"
      - waitForAnimationToEnd
      - tapOn:
          id: done-button
      - waitForAnimationToEnd
# Tap the first market row.
- tapOn:
    id: market-row
    index: 0
- waitForAnimationToEnd
# Detail screen: address row should be present.
- assertVisible:
    id: address-row
# Toggle favorite (star in header).
- tapOn:
    id: favorite-toggle
# Toggle back.
- tapOn:
    id: favorite-toggle
# Go back via the navigation Back button.
- tapOn:
    id: BackButton
- waitForAnimationToEnd
# Should be back on Today.
- assertVisible:
    id: market-row
    index: 0
