appId: ${APP_ID}
tags: [smoke]
---
# Map tab: renders, location permission denied, my-location button present.
- runFlow: e2e/utils/launch.yaml
- waitForAnimationToEnd
# Dismiss auto-opened add modal if present.
- runScript:
    when:
      visible: { id: done-button }
    commands:
      - tapOn:
          text: "Tiong Bahru"
          partial: true
      - tapOn:
          id: done-button
# Navigate to Map tab.
- tapOn:
    id: tab-map
# The my-location button should be visible (location denied, so no user dot).
- assertVisible:
    id: map-my-location
# Navigate back to Today.
- tapOn:
    id: tab-today
